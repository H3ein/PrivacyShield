<!DOCTYPE html>
<html>
<head>
  <title>Manual Learning Stats Test</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #1a1a1a; color: #fff; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #10b981; border: none; color: white; border-radius: 5px; }
    .result { background: #2a2a2a; padding: 15px; margin: 10px 0; border-radius: 5px; }
    pre { background: #000; padding: 10px; border-radius: 3px; overflow: auto; }
  </style>
</head>
<body>
  <h1>PrivacyShield Learning Stats Manual Test</h1>

  <button onclick="testStats()">1. Check Current Stats</button>
  <button onclick="addTestData()">2. Add Test Data Directly</button>
  <button onclick="triggerAnalysis()">3. Trigger URL Analysis</button>
  <button onclick="checkStorage()">4. Check Storage</button>
  <button onclick="resetData()">5. Reset All Data</button>

  <div id="results"></div>

  <script>
    const log = (title, data) => {
      const div = document.createElement('div');
      div.className = 'result';
      div.innerHTML = `<h3>${title}</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
      document.getElementById('results').appendChild(div);
    };

    async function testStats() {
      chrome.runtime.sendMessage({ type: 'GET_LEARNING_STATS' }, (response) => {
        log('GET_LEARNING_STATS Response', response);
      });
    }

    async function addTestData() {
      // Directly add data to storage
      const learningData = {
        feedbackData: [],
        domainConfidence: [
          ['evil-tracker.com', 0.9],
          ['malware-site.tk', 0.95]
        ],
        patternWeights: [
          ['threat:malware', 1.1],
          ['threat:phishing', 1.2],
          ['threat:suspicious_tld', 1.0],
          ['technique:ads:Ad network', 0.5],
          ['technique:ads:Analytics tracker', 0.5],
          ['technique:tracking:Google tracking', 0.5],
          ['technique:tracking:Facebook tracking', 0.5]
        ],
        feedbackCount: 0
      };

      const trustedSites = {
        visitHistory: [
          ['example.com', { visits: 15, lastVisit: Date.now(), totalTime: 900000, firstVisit: Date.now() - 1000000, avgTime: 60000 }]
        ],
        autoWhitelist: ['example.com'],
        manualWhitelist: ['google.com']
      };

      const falsePositiveData = {
        breakageEvents: [],
        corrections: [],
        autoFixedSites: ['broken-site.com', 'another-site.com']
      };

      chrome.storage.local.set({
        learningData,
        trustedSites,
        falsePositiveData
      }, () => {
        log('Test Data Added', { learningData, trustedSites, falsePositiveData });
        alert('Test data added! Now click "1. Check Current Stats" to see if it shows up.');
      });
    }

    async function triggerAnalysis() {
      const testUrls = [
        'https://doubleclick.net/ads/tracking',
        'https://google-analytics.com/collect',
        'https://facebook.com/tr',
        'https://evil-malware-site.tk/download.exe'
      ];

      log('Triggering Analysis', { urls: testUrls });

      // Send message to background to track these
      for (const url of testUrls) {
        chrome.runtime.sendMessage({
          type: 'TRACK_BLOCKED_URL',
          url: url
        }, (response) => {
          console.log('Track response:', response);
        });
      }

      setTimeout(() => {
        testStats();
      }, 1000);
    }

    async function checkStorage() {
      chrome.storage.local.get(null, (data) => {
        log('All Storage Data', data);
      });
    }

    async function resetData() {
      chrome.runtime.sendMessage({ type: 'RESET_LEARNING' }, (response) => {
        log('Reset Response', response);
      });
    }
  </script>
</body>
</html>
