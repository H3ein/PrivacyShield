<!DOCTYPE html>
<html>
<head>
  <title>Test Settings Stats</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    button {
      padding: 10px 20px;
      margin: 10px 5px;
      cursor: pointer;
      background: #10b981;
      border: none;
      color: white;
      border-radius: 5px;
      font-size: 14px;
    }
    button:hover {
      background: #059669;
    }
    .result {
      background: #2a2a2a;
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
      border-left: 3px solid #10b981;
    }
    pre {
      background: #000;
      padding: 10px;
      border-radius: 3px;
      overflow: auto;
      font-size: 12px;
    }
    .error {
      border-left-color: #ef4444;
      background: #3a1a1a;
    }
    .success {
      border-left-color: #10b981;
    }
    h1 {
      color: #10b981;
    }
    .step {
      background: #2a2a2a;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border-left: 3px solid #3b82f6;
    }
  </style>
</head>
<body>
  <h1>🧪 PrivacyShield Settings Stats Test</h1>

  <div class="step">
    <h3>Test Instructions:</h3>
    <ol>
      <li>Reload the extension first</li>
      <li>Visit some websites to generate blocking activity</li>
      <li>Click "Test GET_LEARNING_STATS" below</li>
      <li>Check if stats show non-zero values</li>
    </ol>
  </div>

  <button onclick="testGetLearningStats()">🎯 Test GET_LEARNING_STATS</button>
  <button onclick="checkStorage()">💾 Check Storage Data</button>
  <button onclick="addDummyData()">➕ Add Dummy Learning Data</button>
  <button onclick="clearResults()">🗑️ Clear Results</button>

  <div id="results"></div>

  <script>
    const log = (title, data, isError = false) => {
      const div = document.createElement('div');
      div.className = isError ? 'result error' : 'result success';
      const timestamp = new Date().toLocaleTimeString();
      div.innerHTML = `
        <h3>${title} <small style="color: #666">${timestamp}</small></h3>
        <pre>${JSON.stringify(data, null, 2)}</pre>
      `;
      document.getElementById('results').appendChild(div);
      // Auto-scroll to bottom
      div.scrollIntoView({ behavior: 'smooth' });
    };

    async function testGetLearningStats() {
      try {
        log('Sending Message...', { type: 'GET_LEARNING_STATS' });

        const response = await chrome.runtime.sendMessage({
          type: 'GET_LEARNING_STATS'
        });

        if (!response) {
          log('ERROR: No Response', { message: 'sendMessage returned undefined' }, true);
          return;
        }

        if (response.error) {
          log('ERROR Response', response, true);
          return;
        }

        log('✅ SUCCESS - Learning Stats', response);

        // Highlight important stats
        const stats = {
          'Trusted Sites': response.trustedSitesCount || 0,
          'New Techniques': response.newTechniquesDetected || 0,
          'Auto-Fixed Sites': response.autoFixedSites || 0,
          'Threat Patterns': response.threatPatternsLearned || 0
        };
        log('📊 Key Stats Summary', stats);

      } catch (error) {
        log('ERROR: Exception', {
          message: error.message,
          stack: error.stack
        }, true);
      }
    }

    async function checkStorage() {
      try {
        const data = await chrome.storage.local.get(null);
        log('💾 All Storage Data', data);

        // Specifically check learning data
        if (data.learningData) {
          log('🧠 Learning Data Details', {
            patterns: data.learningData.patternWeights?.length || 0,
            domains: data.learningData.domainConfidence?.length || 0,
            feedback: data.learningData.feedbackCount || 0
          });
        } else {
          log('⚠️  No Learning Data Found', { message: 'learningData not in storage' }, true);
        }

      } catch (error) {
        log('ERROR checking storage', error, true);
      }
    }

    async function addDummyData() {
      try {
        // Add some dummy learning data to test if stats show up
        const dummyData = {
          learningData: {
            feedbackData: [],
            domainConfidence: [
              ['evil-tracker.com', 0.9],
              ['malware-site.tk', 0.95]
            ],
            patternWeights: [
              ['threat:malware', 1.1],
              ['threat:phishing', 1.2],
              ['technique:ads:Analytics tracker', 0.5],
              ['technique:tracking:Google tracking', 0.5],
              ['technique:tracking:Facebook pixel', 0.5]
            ],
            feedbackCount: 0
          }
        };

        await chrome.storage.local.set(dummyData);
        log('✅ Dummy Data Added', dummyData);

        setTimeout(() => {
          alert('Dummy data added! Now:\n1. Reload the extension\n2. Open Settings\n3. Check if stats show:\n   - New Techniques: 3\n   - Threat Patterns: 2');
        }, 500);

      } catch (error) {
        log('ERROR adding dummy data', error, true);
      }
    }

    function clearResults() {
      document.getElementById('results').innerHTML = '';
    }

    // Auto-run test on load
    window.addEventListener('load', () => {
      log('🚀 Test Page Loaded', {
        ready: true,
        extensionAPI: !!chrome.runtime,
        message: 'Click buttons above to test'
      });
    });
  </script>
</body>
</html>
