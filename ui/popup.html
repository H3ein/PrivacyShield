<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyShield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header: Name + Toggle -->
  <header>
    <h1>PRIVACYSHIELD</h1>
    <label class="toggle">
      <input type="checkbox" id="enabled" checked>
      <span id="toggle-text">ON</span>
    </label>
  </header>

  <!-- Stats Grid -->
  <main>
    <div class="stat">
      <span class="stat-value" id="trackers-blocked">0</span>
      <span class="stat-label">TRACKERS</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="ads-blocked">0</span>
      <span class="stat-label">ADS</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="fingerprints-blocked">0</span>
      <span class="stat-label">FINGERPRINTS</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="privacy-score">100</span>
      <span class="stat-label">PRIVACY</span>
    </div>
  </main>

  <!-- Actions -->
  <footer>
    <button id="whitelist-btn">TRUST SITE</button>
    <button id="settings-btn">SETTINGS</button>
  </footer>

  <script src="../src/ui/popup.js" type="module"></script>
</body>
</html>
