<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyShield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="brand">PRIVACYSHIELD</div>
    <div class="toggle-container">
      <input type="checkbox" id="enabled" checked>
      <label for="enabled" class="toggle-switch">
        <span class="toggle-indicator"></span>
      </label>
    </div>
  </header>

  <!-- Main Stats Grid -->
  <main class="stats-grid">
    <div class="stat-cell">
      <div class="stat-number" id="trackers-blocked">0</div>
      <div class="stat-label">TRACKERS</div>
    </div>
    <div class="stat-cell">
      <div class="stat-number" id="ads-blocked">0</div>
      <div class="stat-label">ADS</div>
    </div>
    <div class="stat-cell">
      <div class="stat-number" id="fingerprints-blocked">0</div>
      <div class="stat-label">FINGER</div>
    </div>
    <div class="stat-cell">
      <div class="stat-number" id="privacy-score">100</div>
      <div class="stat-label">PRIVACY SCORE</div>
    </div>
  </main>

  <!-- AI Learning -->
  <section class="ai-learning">
    <div class="ai-header">
      <span class="ai-icon">🤖</span>
      <span class="ai-title">AI PROTECTION</span>
    </div>
    
    <div class="accuracy-display">
      <div class="current-tab">
        <span class="accuracy-label">THIS TAB</span>
        <div class="accuracy-value" id="tab-accuracy">95%</div>
        <span class="accuracy-status" id="tab-status">Optimal</span>
      </div>
      
      <div class="global-accuracy">
        <span class="accuracy-label">GLOBAL</span>
        <div class="accuracy-value" id="global-accuracy">87%</div>
        <span class="learning-info" id="global-info">From 1,247 sites</span>
      </div>
    </div>
    
    <div class="learning-status" id="learning-status">
      <span class="status-icon" id="status-icon">🧠</span>
      <span class="status-text" id="status-text">Learning active</span>
    </div>
  </section>

  <!-- Action Controls -->
  <footer class="controls">
    <button id="whitelist-btn" class="control-btn primary" data-shortcut="T">TRUST SITE</button>
    <button id="settings-btn" class="control-btn secondary" data-shortcut="S">SETTINGS</button>
  </footer>

  <script src="../src/ui/popup.js" type="module"></script>
</body>
</html>
