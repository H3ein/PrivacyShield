<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyShield Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="brand">PRIVACYSHIELD</div>
    <div class="version">v3.0.0</div>
  </header>

  <!-- Main Grid Layout -->
  <main>
    <!-- Left Column - Core Controls -->
    <section class="column">
      <div class="panel">
        <h2>PROTECTION</h2>
        <div class="controls-grid">
          <div class="control-item">
            <input type="checkbox" id="block-ads" checked>
            <label for="block-ads" class="control-label">
              <span class="control-text">BLOCK ADS</span>
              <span class="control-indicator"></span>
            </label>
          </div>
          <div class="control-item">
            <input type="checkbox" id="block-trackers" checked>
            <label for="block-trackers" class="control-label">
              <span class="control-text">BLOCK TRACKERS</span>
              <span class="control-indicator"></span>
            </label>
          </div>
          <div class="control-item">
            <input type="checkbox" id="fingerprint-protection" checked>
            <label for="fingerprint-protection" class="control-label">
              <span class="control-text">FINGERPRINT</span>
              <span class="control-indicator"></span>
            </label>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>INTELLIGENCE</h2>
        <div class="intelligence-display">
          <div class="intelligence-status">
            <span class="status-icon">🧠</span>
            <span class="status-text">SMART LEARNING</span>
          </div>
          <div class="metrics-row">
            <div class="metric-box">
              <span class="metric-value" id="safe-domains">0</span>
              <span class="metric-label">SAFE DOMAINS</span>
            </div>
            <div class="metric-box">
              <span class="metric-value" id="total-requests">0</span>
              <span class="metric-label">REQUESTS</span>
            </div>
          </div>
          <div class="progress-container">
            <div class="progress-bar">
              <div class="progress-fill" id="learning-progress"></div>
            </div>
            <span class="progress-text">Learning active</span>
          </div>
          <button class="action-button" id="reset-learning">RESET LEARNING</button>
        </div>
      </div>
    </section>

    <!-- Center Column - Statistics -->
    <section class="column">
      <div class="panel full-height">
        <h2>STATISTICS</h2>
        <div class="stats-display">
          <div class="stat-row">
            <div class="stat-item">
              <span class="stat-number" id="trackers-blocked">0</span>
              <span class="stat-label">TRACKERS</span>
            </div>
            <div class="stat-item">
              <span class="stat-number" id="ads-blocked">0</span>
              <span class="stat-label">ADS</span>
            </div>
          </div>
          <div class="stat-row">
            <div class="stat-item">
              <span class="stat-number" id="fingerprints-blocked">0</span>
              <span class="stat-label">FINGERPRINTS</span>
            </div>
            <div class="stat-item">
              <span class="stat-number" id="privacy-score">100</span>
              <span class="stat-label">PRIVACY SCORE</span>
            </div>
          </div>
        </div>
        <div class="chart-area">
          <div class="chart-header">
            <span>BLOCKING TRENDS</span>
            <span class="chart-period">7 DAYS</span>
          </div>
          <div class="chart-display">
            <canvas id="trends-chart"></canvas>
          </div>
        </div>
        <button class="action-button" id="reset-stats">RESET STATISTICS</button>
      </div>
    </section>

    <!-- Right Column - Management -->
    <section class="column">
      <div class="panel">
        <h2>WHITELIST</h2>
        <div class="whitelist-container">
          <textarea id="whitelist" placeholder="example.com&#10;trusted-site.com"></textarea>
          <div class="whitelist-info">
            <span id="domain-count">0 DOMAINS</span>
          </div>
          <button class="action-button" id="save-whitelist">SAVE WHITELIST</button>
        </div>
      </div>

      <div class="panel">
        <h2>MANAGEMENT</h2>
        <div class="management-controls">
          <button class="management-button" id="export-settings">
            <span class="button-icon">↑</span>
            <span class="button-text">EXPORT</span>
          </button>
          <button class="management-button" id="import-settings">
            <span class="button-icon">↓</span>
            <span class="button-text">IMPORT</span>
          </button>
          <button class="management-button danger" id="reset-all">
            <span class="button-icon">✕</span>
            <span class="button-text">RESET ALL</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-info">
      <span>PRIVACYSHIELD EXTENSION</span>
      <span class="separator">•</span>
      <span>BRAUTALIST MINIMALIST DESIGN</span>
    </div>
  </footer>

  <script src="../src/ui/settings.js" type="module"></script>
</body>
</html>
