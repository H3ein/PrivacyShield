<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyShield Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header>
    <h1>PRIVACY SHIELD SETTINGS</h1>
  </header>

  <main>
    <!-- Core Settings -->
    <section>
      <h2>BLOCKING</h2>
      <label>
        <input type="checkbox" id="block-ads" checked>
        <span>Block Ads</span>
      </label>
      <label>
        <input type="checkbox" id="block-trackers" checked>
        <span>Block Trackers</span>
      </label>
      <label>
        <input type="checkbox" id="fingerprint-protection" checked>
        <span>Fingerprint Protection</span>
      </label>
    </section>

    <!-- Whitelist -->
    <section>
      <h2>WHITELISTED SITES</h2>
      <textarea id="whitelist" rows="10" placeholder="example.com&#10;trusted-site.com"></textarea>
      <button id="save-whitelist">SAVE WHITELIST</button>
    </section>

    <!-- Stats -->
    <section>
      <h2>ALL-TIME STATS</h2>
      <div class="stat-row">
        <span>TOTAL TRACKERS BLOCKED:</span>
        <span id="total-trackers">0</span>
      </div>
      <div class="stat-row">
        <span>TOTAL ADS BLOCKED:</span>
        <span id="total-ads">0</span>
      </div>
      <div class="stat-row">
        <span>TOTAL FINGERPRINTS BLOCKED:</span>
        <span id="total-fingerprints">0</span>
      </div>
      <button id="reset-stats">RESET STATS</button>
    </section>

    <!-- Info -->
    <section>
      <h2>ABOUT</h2>
      <p>PrivacyShield v3.0.0</p>
      <p>Brutalist minimal privacy protection</p>
      <p>Chrome MV3 Extension</p>
    </section>
  </main>

  <script src="../src/ui/settings.js" type="module"></script>
</body>
</html>
